<!--Abans de començar (backend, un sol cop)

Ara mateix la API no té res de reserves. Fes aquests dos endpoints, calcats dels de
manteniments (no cal que siguin perfectes):
-GET /reserves: retorna les reserves amb un JOIN a VEHICLES i CONDUCTORS, perquè
arribin MATRICULA, MARCA i NOM (no només els números).
-POST /reserves: amb un model Pydantic (vehicle_id, conductor_id, data_inici,
data_fi), amb el 1452 convertit en 404.

Bloc 1: Llistar i calcular (1-4)

1. Taula de reserves
 Pinta les reserves en una taula amb Matrícula, Conductor, Inici, Fi i Estat.
 Separa-ho en dues funcions: una que demana i una altra que pinta
 (pintarTaulaReserves(llista)).

2. Colors per estat de la reserva
 Posa l'estat en verd (ACTIVA), gris (FINALITZADA) o taronja (PENDENT). Pista:
 la variable color calculada dins del bucle, com amb els vehicles.

3. Resum amb comptadors
 Mostra en un <p>: "X actives, Y pendents i Z finalitzades". Pista: tres comptadors
 que sumin dins d'un sol bucle.

4. Qui té més reserves
 Mostra en un <p> el nom del conductor amb més reserves. Pista: un objecte que faci
 de comptador, per exemple comptador[nom] = (comptador[nom] || 0) + 1, i després
 busques el màxim.
 👉 És el més difícil del bloc. Si se't fa gran, fes-lo en comentaris abans de
 programar-ho.
-->

<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La meva pagina web</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <p id="p_missatge_error"></p>
    <h4>Taula reserves</h4>

    <div>
      <label for="select_estat_reserva">Estat de la reserva: </label>
      <select name="select_estat_reserva" id="select_estat_reserva">
        <option value="Tots">Tots</option>
        <option value="ACTIVA">ACTIVA</option>
        <option value="PENDENT">PENDENT</option>
        <option value="FINALITZADA">FINALITZADA</option>
      </select>
    </div>
    <div>
      <label for="input_buscador">Conductor: </label>
      <input type="text" id="input_buscador">
    </div>

    <table>
      <thead>
      <tr>
        <th>Matrícula</th>
        <th>Conductor</th>
        <th>Data inici</th>
        <th>Data fi</th>
        <th>Estat reserva</th>
      </tr>
      </thead>
      <tbody id="tbody_taula_reserves">

      </tbody>
    </table>
    <p id="p_comptador_reserves"></p>
    <p id="p_reserves_avui"></p>
    <button id="btn_reserves_avui">Cercar reserves d'avui</button>

    <h4>Formulari reserves</h4>
    <div>
      <label for="select_vehicle">Vehicle: </label>
      <select name="select_vehicle" id="select_vehicle">

      </select>
    </div>
    <div>
      <label for="select_conductor">Conductor: </label>
      <select name="select_conductor" id="select_conductor">

      </select>
    </div>
    <div>
      <label for="input_data_inici">Data inici: </label>
      <input type="datetime-local" id="input_data_inici">
    </div>
    <div>
      <label for="input_data_fi">Data fi: </label>
      <input type="datetime-local" id="input_data_fi">
    </div>
    <div>
      <label for="select_estat">Estat reserva: </label>
      <select name="select_estat" id="select_estat">
        <option value="ACTIVA">ACTIVA</option>
        <option value="PENDENT">PENDENT</option>
        <option value="FINALITZADA">FINALITZADA</option>
      </select>
    </div>
    <button id="btn_reservar">Reservar</button>
    <p id="p_missatge_error_formulari"></p>
    <script src="index.js"></script>
  </body>
</html>
